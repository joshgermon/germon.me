name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

# A newer deploy waits for the active one to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PUBLIC_DATA_TOKEN }}
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PUBLIC_DATA_TOKEN: ${{ secrets.GH_PUBLIC_DATA_TOKEN }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Runtime secrets travel as Worker secrets, never as vars: the GitHub token, and the
          # OpenSky API client the experiments' recorder uses. Unset ones are left out.
          jq -n \
            --arg github "${GH_PUBLIC_DATA_TOKEN:-}" \
            --arg openskyId "${OPENSKY_CLIENT_ID:-}" \
            --arg openskySecret "${OPENSKY_CLIENT_SECRET:-}" \
            '{GITHUB_TOKEN: $github, OPENSKY_CLIENT_ID: $openskyId, OPENSKY_CLIENT_SECRET: $openskySecret}
             | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          if [ "$(jq 'length' "$RUNNER_TEMP/secrets.json")" -gt 0 ]; then
            pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          else
            pnpm exec wrangler deploy
          fi
