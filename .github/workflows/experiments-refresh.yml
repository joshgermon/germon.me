name: Refresh experiments

# Experiments with live-ish data (scripts/experiments/<slug>/refresh.ts) re-bake every 30 minutes
# and redeploy, until each manifest's `refreshUntil` passes; after that this does nothing and
# deploys nothing. The site's content is unchanged by these deploys.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore experiments cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: experiments-${{ github.run_id }}
          restore-keys: experiments-

      - name: Refresh experiments
        id: refresh
        run: pnpm experiments:refresh

      - name: Build
        if: steps.refresh.outputs.refreshed != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PUBLIC_DATA_TOKEN }}
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        if: steps.refresh.outputs.refreshed != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PUBLIC_DATA_TOKEN: ${{ secrets.GH_PUBLIC_DATA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GH_PUBLIC_DATA_TOKEN:-}" ]; then
            jq -n --arg t "$GH_PUBLIC_DATA_TOKEN" '{GITHUB_TOKEN: $t}' > "$RUNNER_TEMP/secrets.json"
            pnpm exec wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"
          else
            pnpm exec wrangler deploy
          fi
